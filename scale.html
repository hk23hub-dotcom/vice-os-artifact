  :root {
    --ground: #0c0a08;
    --surface: #181310;
    --surface-2: #221b15;
    --line: #322a20;
    --ink: #f2ead9;
    --ink-muted: #9c8f76;
    --ink-faint: #6b6151;
    --gold: #e8c15c;
    --gold-deep: #c08430;
    --unlit: #2a231b;
    --display: 'Anton', 'Arial Narrow', system-ui, sans-serif;
    --body: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  html { background: var(--ground); }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 430px;
    padding: 40px 22px 56px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  /* ---------- header ---------- */
  header { display: flex; flex-direction: column; gap: 6px; }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0;
  }
  .wordmark {
    font-family: var(--display);
    font-size: clamp(38px, 11vw, 48px);
    line-height: 0.95;
    letter-spacing: 0.015em;
    text-transform: uppercase;
    margin: 0;
    text-wrap: balance;
  }
  .wordmark em { font-style: normal; color: var(--gold); }
  .datestamp {
    font-size: 13px;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
    margin: 4px 0 0;
    font-variant-numeric: tabular-nums;
  }
  .datestamp strong { color: var(--gold); font-weight: 700; }

  /* ---------- readout ---------- */
  .readout {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    min-height: 178px;
    justify-content: flex-end;
  }
  .level-figure {
    font-family: var(--display);
    font-size: 104px;
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 8px;
    color: var(--gold);
    transition: color 300ms ease;
  }
  .level-figure .of-ten {
    font-family: var(--body);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }
  .level-label {
    font-family: var(--display);
    font-size: 23px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--gold);
    transition: color 300ms ease;
    margin: 8px 0 0;
    min-height: 1em;
    text-align: center;
  }
  .level-message {
    font-size: 14px;
    color: var(--ink-muted);
    text-align: center;
    margin: 7px 0 0;
    max-width: 32ch;
    line-height: 1.45;
  }

  /* ---------- meter ---------- */
  .meter {
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    gap: 5px;
    align-items: end;
    height: 150px;
    touch-action: none;
  }
  .meter button {
    appearance: none;
    border: 0;
    padding: 0;
    margin: 0;
    background: var(--unlit);
    border-radius: 4px 4px 2px 2px;
    cursor: pointer;
    height: calc(30% + var(--i) * 7%);
    transition: background 200ms ease, box-shadow 200ms ease;
  }
  .meter button.lit { background: var(--seg); }
  .meter button.tip { box-shadow: 0 0 18px color-mix(in srgb, var(--seg) 45%, transparent); }
  .meter button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  .meter-scale {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- log button ---------- */
  .log-btn {
    appearance: none;
    border: 0;
    font-family: var(--display);
    font-size: 19px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    background: var(--gold);
    color: #1c1508;
    border-radius: 6px;
    padding: 15px 0 13px;
    cursor: pointer;
    transition: transform 120ms ease, opacity 120ms ease;
  }
  .log-btn:hover { transform: translateY(-1px); }
  .log-btn:active { transform: translateY(0); }
  .log-btn:disabled { opacity: 0.35; cursor: default; transform: none; }
  .log-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* ---------- boost drop ---------- */
  .drop {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .drop.show { display: flex; animation: dropIn 380ms cubic-bezier(0.2, 0.9, 0.3, 1.15); }
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-14px); }
    to { opacity: 1; transform: none; }
  }
  .drop-eyebrow {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .drop-eyebrow .cat { color: var(--gold); }
  .drop-eyebrow .tag { color: var(--ink-faint); }
  .drop-text {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.45;
    text-wrap: balance;
  }
  .drop-text.caps {
    font-family: var(--display);
    font-weight: 400;
    font-size: 27px;
    line-height: 1.12;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .redraw {
    appearance: none;
    background: none;
    border: 0;
    padding: 4px 0;
    align-self: flex-start;
    color: var(--ink-muted);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .redraw:hover { color: var(--gold); }
  .redraw:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- history ---------- */
  .history {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .history-title {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0;
    font-weight: 600;
  }
  .chips { display: flex; gap: 6px; }
  .chip {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .chip strong { color: var(--gold); font-weight: 700; }

  .strip {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 4px;
    align-items: end;
    height: 72px;
  }
  .slot {
    position: relative;
    height: 100%;
    display: flex;
    align-items: flex-end;
  }
  .slot .bar {
    width: 100%;
    border-radius: 3px 3px 1px 1px;
    background: var(--gold-deep);
    min-height: 4px;
  }
  .slot.today .bar { background: var(--gold); }
  .slot.empty .bar {
    height: 4px;
    min-height: 0;
    background: transparent;
    border-bottom: 2px dashed var(--line);
    border-radius: 0;
  }
  .slot:hover .bar { filter: brightness(1.15); }
  .strip-days {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 4px;
    font-size: 10px;
    color: var(--ink-faint);
    text-align: center;
    letter-spacing: 0.04em;
  }
  .strip-days .today { color: var(--gold); font-weight: 700; }

  .tooltip {
    position: fixed;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    padding: 5px 9px;
    border-radius: 6px;
    pointer-events: none;
    white-space: nowrap;
    transform: translate(-50%, calc(-100% - 10px));
    opacity: 0;
    transition: opacity 120ms ease;
    z-index: 5;
  }
  .tooltip.show { opacity: 1; }

  /* ---------- toast & footer ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 8px);
    background: var(--gold);
    color: #1c1508;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 9px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="app">
  <header>
    <p class="eyebrow">HK23 &#183; Daily check-in</p>
    <h1 class="wordmark">Motivation <em>Scale</em></h1>
    <p class="datestamp" id="datestamp"></p>
  </header>

  <section class="readout" aria-live="polite">
    <div class="level-figure" id="figure">
      <span id="level-num">&#8212;</span><span class="of-ten">/ 10</span>
    </div>
    <p class="level-label" id="level-label"></p>
    <p class="level-message" id="message">Tap the meter. Where's the fire today?</p>
  </section>

  <section>
    <div class="meter" id="meter" aria-label="Motivation meter, 0 to 10"></div>
    <div class="meter-scale" aria-hidden="true"><span>0</span><span>10</span></div>
  </section>

  <button class="log-btn" id="log-btn" disabled>Log today</button>

  <section class="drop" id="drop" aria-live="polite">
    <div class="drop-eyebrow"><span class="cat" id="drop-cat"></span><span class="tag">Today's drop</span></div>
    <p class="drop-text" id="drop-text"></p>
    <button class="redraw" id="redraw" type="button">&#8635; Draw another</button>
  </section>

  <section class="history">
    <div class="history-head">
      <h2 class="history-title">Last 14 days</h2>
      <div class="chips">
        <span class="chip" id="chip-streak">Streak &#183; <strong>0</strong></span>
        <span class="chip" id="chip-avg">Avg &#183; <strong>&#8212;</strong></span>
      </div>
    </div>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="strip-days" id="strip-days" aria-hidden="true"></div>
    <table class="visually-hidden" id="history-table">
      <caption>Motivation log, last 14 days</caption>
      <thead><tr><th scope="col">Date</th><th scope="col">Level (0&#8211;10)</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <footer>Data stays in this browser &#183; HK23</footer>
</div>

<div class="tooltip" id="tooltip" role="presentation"></div>
<div class="toast" id="toast">Logged.</div>

<script>
  const STORE_KEY = 'hk23-motivation-log';
  const BOOST_KEY = 'hk23-motivation-boost';

  // Anchor labels from the original notebook scale (0\u201310)
  const LABELS = [
    '0% motivation', 'No way!', 'No way!', 'Maybe not', 'Maybe not',
    'Neutral', "Let's go", "Let's go!", 'Motivated 100%', 'Motivated 100%',
    'Extreme motivation'
  ];
  const MESSAGES = [
    'Rock bottom holds weight. Stand on it.',
    'Low fuel. Do one small thing anyway.',
    'Embers. Protect them.',
    "Warming up. Don't judge the start.",
    'Almost neutral. Pick one small target.',
    'Halfway heat. Choose a direction.',
    "There's a pulse. Feed it.",
    'Rolling. Keep the streak alive.',
    'Hot. Ship something today.',
    'Blazing. Point it at the big one.',
    'Full send.'
  ];

  // Boost deck \u2014 distilled from your own material
  const DECK = [
    { cat: 'Control', text: 'Rumores, el pasado, opiniones ajenas: fuera de tu c\u00edrculo. Su\u00e9ltalos hoy.' },
    { cat: 'Control', text: 'Tu energ\u00eda, tu esfuerzo, tu actitud: eso s\u00ed es tuyo. Trabaja solo ah\u00ed.' },
    { cat: 'Control', text: 'A qui\u00e9n le das tu atenci\u00f3n es decisi\u00f3n tuya. El\u00edgela como si costara plata.' },
    { cat: 'Control', text: 'Los errores de ayer quedaron fuera del c\u00edrculo. Tu reacci\u00f3n de hoy est\u00e1 dentro.' },
    { cat: 'Control', text: 'Lo que consumes est\u00e1 en tu control. Cierra la app y abre el proyecto.' },
    { cat: 'Declara', text: "Deja de decir 'estoy cansado'. Empieza: 'estoy creciendo'. Las palabras moldean." },
    { cat: 'Declara', text: 'Declara vida sobre ti: agradecido, creciendo, prosperando, ganando.' },
    { cat: 'Declara', text: 'Habla desde donde vas, no desde donde estuviste.' },
    { cat: 'Declara', text: 'Las palabras son semillas. Lo que declares hoy, lo cosechas ma\u00f1ana.' },
    { cat: 'El 1%', text: '10 p\u00e1ginas hoy no te hacen lector. Un a\u00f1o de eso, s\u00ed. Lee las 10.' },
    { cat: 'El 1%', text: 'Anota un logro peque\u00f1o hoy. Un d\u00eda perdido te va a salvar.' },
    { cat: 'El 1%', text: 'Una conversaci\u00f3n nueva abre una puerta. Y una puerta lleva a otras.' },
    { cat: 'El 1%', text: 'No es magia. Es repetici\u00f3n. Respeta lo m\u00ednimo.' },
    { cat: 'El 1%', text: 'Lo peque\u00f1o no se nota\u2026 hasta que pesa. Y cuando pesa, ya te transform\u00f3.' },
    { cat: 'Mente fuerte', text: 'Acepta la situaci\u00f3n dif\u00edcil tal como es. Ah\u00ed parte la fuerza.' },
    { cat: 'Mente fuerte', text: 'Enfrenta hoy una cosa que te asusta. Con una basta.' },
    { cat: 'Mente fuerte', text: 'Ese pensamiento negativo: \u00bfes un hecho o es un cuento? Desaf\u00edalo.' },
    { cat: 'Mente fuerte', text: 'El fracaso es lecci\u00f3n, no identidad. \u00dasalo.' },
    { cat: 'Mente fuerte', text: 'Un cambio real lleva tiempo. Mantente en tu camino.' },
    { cat: 'Unbreakable', caps: true, text: 'Unbreakable. No matter what comes, you rise again.' },
    { cat: 'Unbreakable', caps: true, text: 'Discipline makes you unshakable.' },
    { cat: 'Unbreakable', caps: true, text: 'Your purpose keeps you standing tall.' },
    { cat: 'Unbreakable', caps: true, text: 'Held by something stronger than fear.' },
    { cat: 'Unbreakable', caps: true, text: 'Extreme motivation is a decision. Make it.' },
    { cat: 'Receipts', text: '33.731 ejecuciones en 31 meses. Constancia ya tienes \u2014 ap\u00fantala a lo que pesa.' },
    { cat: 'Receipts', text: 'Octubre 2023 \u2192 hoy, y sigues en el juego. Eso ya te separa de la mayor\u00eda.' },
    { cat: 'Receipts', text: 'Llevas 80+ d\u00edas midi\u00e9ndote en papel. Esto solo hace visible lo que ya haces.' }
  ];
  function catsFor(level) {
    if (level <= 3) return ['Control', 'Declara', 'El 1%'];
    if (level <= 6) return ['El 1%', 'Mente fuerte', 'Declara', 'Receipts'];
    return ['Unbreakable', 'Mente fuerte', 'Receipts'];
  }

  // Heat ramp: ember (0) -> deep gold -> bright gold (10)
  const RAMP_STOPS = [[138, 74, 46], [192, 132, 48], [232, 193, 92]];
  function rampColor(level) {
    const t = level / 10;
    const seg = t < 0.5 ? 0 : 1;
    const local = (t - seg * 0.5) / 0.5;
    const a = RAMP_STOPS[seg], b = RAMP_STOPS[seg + 1];
    const mix = a.map((v, i) => Math.round(v + (b[i] - v) * local));
    return `rgb(${mix.join(',')})`;
  }

  const dayKey = d =>
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = new Date();
  const todayKey = dayKey(today);

  function loadJSON(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
  }
  let log = loadJSON(STORE_KEY) || {};
  const saveLog = () => localStorage.setItem(STORE_KEY, JSON.stringify(log));

  let selected = (todayKey in log) ? log[todayKey] : null;

  // ---------- header date + day count ----------
  function renderDatestamp() {
    const dateText = today.toLocaleDateString('en-US',
      { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    const n = Object.keys(log).length;
    document.getElementById('datestamp').innerHTML =
      n ? `${dateText} \u00b7 <strong>Day ${n}</strong>` : dateText;
  }

  // ---------- meter ----------
  const meter = document.getElementById('meter');
  const bars = [];
  for (let i = 0; i <= 10; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.style.setProperty('--i', i);
    b.style.setProperty('--seg', rampColor(i));
    b.setAttribute('aria-label', `Set motivation to ${i}`);
    b.addEventListener('click', () => setLevel(i));
    b.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        e.preventDefault(); const n = Math.min(10, i + 1); setLevel(n); bars[n].focus();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        e.preventDefault(); const n = Math.max(0, i - 1); setLevel(n); bars[n].focus();
      }
    });
    meter.appendChild(b);
    bars.push(b);
  }

  // drag / scrub across the meter
  let scrubbing = false;
  function levelFromX(clientX) {
    const r = meter.getBoundingClientRect();
    const t = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    return Math.min(10, Math.floor(t * 11));
  }
  meter.addEventListener('pointerdown', e => {
    scrubbing = true;
    meter.setPointerCapture(e.pointerId);
    setLevel(levelFromX(e.clientX));
  });
  meter.addEventListener('pointermove', e => {
    if (scrubbing) setLevel(levelFromX(e.clientX));
  });
  meter.addEventListener('pointerup', () => { scrubbing = false; });

  // ---------- readout ----------
  const numEl = document.getElementById('level-num');
  const labelEl = document.getElementById('level-label');
  const msgEl = document.getElementById('message');
  const figEl = document.getElementById('figure');
  const logBtn = document.getElementById('log-btn');

  function setLevel(level) {
    selected = level;
    const c = rampColor(level);
    numEl.textContent = level;
    figEl.style.color = c;
    labelEl.style.color = c;
    labelEl.textContent = LABELS[level];
    msgEl.textContent = MESSAGES[level];
    bars.forEach((b, idx) => {
      b.classList.toggle('lit', idx <= level);
      b.classList.toggle('tip', idx === level);
    });
    logBtn.disabled = false;
    logBtn.textContent = (todayKey in log) ? 'Update today' : 'Log today';
  }

  // ---------- boost drop ----------
  const drop = document.getElementById('drop');
  const dropCat = document.getElementById('drop-cat');
  const dropText = document.getElementById('drop-text');
  let currentBoost = null;

  function drawBoost(level, excludeIdx) {
    const cats = catsFor(level);
    let pool = DECK.map((c, i) => ({ c, i })).filter(x => cats.includes(x.c.cat));
    const trimmed = pool.filter(x => x.i !== excludeIdx);
    if (trimmed.length) pool = trimmed;
    return pool[Math.floor(Math.random() * pool.length)].i;
  }
  function showBoost(idx) {
    const card = DECK[idx];
    if (!card) return;
    currentBoost = idx;
    dropCat.textContent = card.cat;
    dropText.textContent = card.text;
    dropText.classList.toggle('caps', !!card.caps);
    drop.classList.remove('show');
    void drop.offsetWidth; // restart the drop-in animation
    drop.classList.add('show');
    localStorage.setItem(BOOST_KEY, JSON.stringify({ date: todayKey, idx }));
  }
  document.getElementById('redraw').addEventListener('click', () => {
    showBoost(drawBoost(selected != null ? selected : 5, currentBoost));
  });

  // ---------- logging ----------
  const toast = document.getElementById('toast');
  let toastTimer;
  logBtn.addEventListener('click', () => {
    if (selected == null) return;
    const isUpdate = todayKey in log;
    log[todayKey] = selected;
    saveLog();
    renderHistory();
    renderDatestamp();
    logBtn.textContent = 'Update today';
    toast.textContent = isUpdate ? 'Updated.' : 'Logged.';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
    showBoost(drawBoost(selected, currentBoost));
  });

  // ---------- history ----------
  const strip = document.getElementById('strip');
  const stripDays = document.getElementById('strip-days');
  const tableBody = document.querySelector('#history-table tbody');
  const tooltip = document.getElementById('tooltip');

  function renderHistory() {
    strip.innerHTML = '';
    stripDays.innerHTML = '';
    tableBody.innerHTML = '';

    let sum = 0, count = 0;
    for (let i = 13; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const k = dayKey(d);
      const v = (k in log) ? log[k] : null;
      const isToday = k === todayKey;

      const slot = document.createElement('div');
      slot.className = 'slot' + (isToday ? ' today' : '') + (v == null ? ' empty' : '');
      const bar = document.createElement('div');
      bar.className = 'bar';
      if (v != null) { bar.style.height = `${v * 10}%`; sum += v; count++; }
      slot.appendChild(bar);

      const label = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const tipText = v != null ? `${label} \u00b7 ${v}/10` : `${label} \u00b7 not logged`;
      slot.addEventListener('pointerenter', () => {
        tooltip.textContent = tipText;
        const r = slot.getBoundingClientRect();
        tooltip.style.left = `${r.left + r.width / 2}px`;
        tooltip.style.top = `${r.top}px`;
        tooltip.classList.add('show');
      });
      slot.addEventListener('pointerleave', () => tooltip.classList.remove('show'));
      strip.appendChild(slot);

      const dl = document.createElement('span');
      dl.textContent = d.toLocaleDateString('en-US', { weekday: 'narrow' });
      if (isToday) dl.className = 'today';
      stripDays.appendChild(dl);

      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${label}</td><td>${v != null ? v : 'not logged'}</td>`;
      tableBody.appendChild(tr);
    }

    // streak: consecutive logged days ending today (or yesterday if today pending)
    let streak = 0;
    const start = new Date(today);
    if (!(todayKey in log)) start.setDate(start.getDate() - 1);
    for (let d = new Date(start); dayKey(d) in log; d.setDate(d.getDate() - 1)) streak++;

    document.querySelector('#chip-streak strong').textContent =
      streak === 1 ? '1 day' : `${streak} days`;
    document.querySelector('#chip-avg strong').textContent =
      count ? (sum / count).toFixed(1) : '\u2014';
  }

  // ---------- init ----------
  renderDatestamp();
  renderHistory();
  if (selected != null) setLevel(selected);
  const savedBoost = loadJSON(BOOST_KEY);
  if (savedBoost && savedBoost.date === todayKey && (todayKey in log) && DECK[savedBoost.idx]) {
    showBoost(savedBoost.idx);
  }
</script>

</body>
